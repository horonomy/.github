# Runs the stdlib unittest suites under scripts/, agents/common/, and
# agents/adapters/**/ — the company-metadata generator, the workspace
# bootstrap CLI, the skill projection generator, the Public Release Surface
# Contract reconciler, and the Codex adapter. All of these tests are fully
# offline (network/gh/codex calls are dependency-injected and faked);
# nothing here makes a live network call or requires `codex` on PATH.
name: Scripts tests

# The skill trees are in these filters because two of the checks below read
# them: test_project_skills.py pins what the canonical sources under
# agents/skills/ project to, and doctor.py's drift check compares the generated
# .claude/skills/ and .codex/skills/ trees against those sources. Without them
# the filter was root-anchored past the thing it guarded — `scripts/**` matches
# scripts/doctor.py and not agents/skills/<skill>/scripts/*, so a skill asset
# could be added, renamed or deleted and neither check would be consulted. That
# is how a failing pin sat on main unreported (HORO-1513).
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/**
      - governance/product/host-adapter/**
      - governance/product/host-adapter-contract.md
      - governance/product/execution-identity-contract.md
      - agents/common/**
      - agents/adapters/**
      - agents/skills/**
      - .claude/skills/**
      - .codex/skills/**
      - .github/workflows/scripts-tests.yml
  push:
    branches: [main]
    paths:
      - scripts/**
      - governance/product/host-adapter/**
      - governance/product/host-adapter-contract.md
      - governance/product/execution-identity-contract.md
      - agents/common/**
      - agents/adapters/**
      - agents/skills/**
      - .claude/skills/**
      - .codex/skills/**
      - .github/workflows/scripts-tests.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: unittest discover
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Show Python version
        run: python3 --version
      - name: Install pinned schema validator
        run: python3 -m pip install --only-binary :all: jsonschema==4.26.0
      - name: Run scripts/ tests
        run: python3 -m unittest discover -s scripts
      - name: Run agents/common/ tests
        run: python3 -m unittest discover -s agents/common
      - name: Run agents/adapters/codex/ tests
        run: python3 -m unittest discover -s agents/adapters/codex
      - name: Real doctor run against this repo (dogfood)
        run: python3 scripts/doctor.py --repo . --expected-org horonomy
