# Public Release Surface Contract evidence for Circinus (HORO-515).
#
# claimed_lifecycle reflects Circinus's own README ("Experimental MVP
# (v0.0.0) — not production security software.") — matching the Product
# Registry's maturity entry (horonomy/official-website
# src/data/productRegistry.ts, HORO-282) and the GitHub org profile
# (profile/README.md), both of which already list it as "Experimental".
# The GitHub repo itself is private, but the product has a live public
# marketing/docs/hosted-API site at circinus.horo.run (verified 200) — repo
# visibility governs whether the *code* is public, not whether the
# *product* is, and experimental is a legitimately publishable maturity
# tier (see check_org_profile/check_horonom_com's three-way logic). No
# releases exist yet, so `beta`/`release_candidate`/`available` would be
# claim-widening (`tags_releases` FAILED) — experimental is the only
# accurate claim.
# HORO-1700 reconciliation (2026-10-09): populated website/docs/
# hosted_service below from live, verified URLs. The comment above
# (written against the pre-HORO-566/569 host circinus.horo.run) is now
# stale on the hostname but the maturity reasoning still holds — leaving
# it for history rather than rewriting, see the live canonical host used
# below instead.
product: circinus
claimed_lifecycle: experimental
github:
  org: horonomy
  repo: circinus
website: https://circinus.horonom.com
docs: https://circinus.horonom.com/docs
hosted_service: https://api.circinus.horo.run/health
