# Horonom documentation analytics registry (HORO-587/HORO-588).
#
# Machine-readable mirror of horonomy/internal-docs's
# docs/registers/docs-analytics-migration.md — that file is the narrative/
# evidence copy (full curl/dig/grep evidence, rationale prose); this file is
# the structured copy for tooling (HORO-592's reconciliation pass reads
# this rather than re-parsing prose). Update both together.
#
# Built from live DNS/HTTP inspection (2026-09-06), not from Jira
# descriptions or GA stream URLs alone — a Documentation stream URL
# existing does not by itself prove the corresponding docs DNS/site
# exists. See the narrative register for the specific evidence behind
# each value.
#
# Schema:
#   product: canonical product id
#   parent_epic: HORO-587
#   implementation_ticket: product-owned HORO-xx/FORNX-xx ticket, or null
#                          if no public docs surface exists to instrument
#   docs_surface_current: the live docs URL/path today, or null
#   docs_surface_target: the intended canonical docs URL/path, or null
#   docs_dns_status: not_provisioned | provisioned_live | path_based_no_subdomain
#   documentation_stream:
#     name: GA4 stream display name ("Documentation"), or null
#     stream_id: GA4 Stream ID, or null
#     measurement_id: GA4 Measurement ID, or null
#   marketing_stream_note: free text distinguishing the docs stream from
#                          any known marketing/application stream for the
#                          same product (see domain-migration-inventory.yaml)
#   property_relationship_verified: true | false — whether the docs
#                                    stream was confirmed to belong to the
#                                    product's intended GA4 property
#   implementation_status: not_started | in_progress | complete | not_applicable
#   live_browser_verification_status: not_performed | partial | complete
#   privacy_notes: free text, or null
#   blockers: free text, or null

