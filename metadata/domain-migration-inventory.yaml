# Horonom product domain migration inventory (HORO-566/HORO-567).
#
# Machine-readable mirror of horonomy/internal-docs's
# docs/registers/product-domain-migration.md — that file is the narrative/
# evidence copy (full curl/dig/grep evidence, rationale prose); this file is
# the structured copy for tooling (HORO-572's reconciliation pass reads
# this rather than re-parsing prose). Update both together.
#
# Built from live DNS/HTTP inspection and repository greps (2026-09-05),
# not from Jira descriptions alone — see the narrative register for the
# specific evidence behind each value.
#
# Schema:
#   product: canonical product id (matches metadata/release-evidence/<id>.yaml
#            where one exists)
#   discovery_ticket: HVDL-xx idea/discovery ticket
#   migration_ticket: product-owned HORO-xx/FORNX-xx implementation ticket,
#                      or null if no public surface exists to migrate
#   current_site / target_site: null if no public surface exists
#   current_docs / target_docs: null if not applicable
#   dns_status: not_provisioned | provisioned | redirect_only
#   ga4:
#     current_id: a GA4 Measurement ID found live/configured today, or null
#     target_id: the founder-provided or otherwise approved target ID, or
#                null if not yet known (never invented — see HORO-566)
#     status: not_installed | live_old_domain | live_new_domain | blocked_on_founder_input
#   migration_status: not_started | in_progress | complete | not_applicable
#   blockers: free text, or null

