      - "G-SK9BL6R66J"   # Ophiuchus marketing
      - "G-2X3VEZ2SG4"   # Ophiuchus docs
      - "G-R4QEL954T0"   # Horologium marketing
      - "G-46CVCDFC4G"   # Horologium docs
      - "G-YHE60HB2FV"   # Horologium application
    live_browser_verification_status: not_performed
    notes: "Founder-provided ground truth (2026-09-06), HORO-595. To be updated to complete once real-browser production verification lands (HORO-595 implementation)."
